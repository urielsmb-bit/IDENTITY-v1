<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- Preconexiones de red (DNS + TLS) -->
  <link rel="preconnect" href="https://www.youtube.com" crossorigin />
  <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
  <link rel="dns-prefetch" href="https://www.youtube.com" />
  <link rel="dns-prefetch" href="https://i.ytimg.com" />

  <title>IDENTITY — Tu identidad, en línea.</title>
  <meta name="description" content="Crea un perfil que se sienta como tú. Temas, efectos, badges y estadísticas." />
  <meta name="theme-color" content="#050505" />
  <meta name="color-scheme" content="dark" />

  <!-- La tarjeta de vista previa por defecto.
       No había NINGUNA: pegar un enlace de IDENTITY en Discord, WhatsApp o
       Twitter no enseñaba nada, porque quien arma esa tarjeta es un robot
       que no ejecuta JavaScript y aquí la página se rellena en el navegador.
       Estas son las de todo el sitio; las de cada perfil las pone
       `api/perfil.ts` en el servidor, con su nombre y su foto. -->
  <meta property="og:site_name" content="IDENTITY" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="IDENTITY — Tu identidad, en línea." />
  <meta property="og:description" content="Crea un perfil que se sienta como tú. Temas, efectos, badges y estadísticas." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="IDENTITY — Tu identidad, en línea." />
  <meta name="twitter:description" content="Crea un perfil que se sienta como tú. Temas, efectos, badges y estadísticas." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Anton&family=Pirata+One&family=VT323&family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap"
  />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
