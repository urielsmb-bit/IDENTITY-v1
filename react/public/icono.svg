<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="sharee">
  <!--
    La marca de sharee.

    Trazada del render original (`Diseño sin título.png`) y NO a mano: el
    trazado que venia hecho salio en negativo -el logo como agujeros dentro
    de un rectangulo de 1920x1080- y con los bordes astillados, porque el
    trazador leyo el bisel del render 3D como si fuera tinta.

    Aqui se hizo al reves: umbral BAJO (90 de 255) para que las caras
    oscuras del bisel cuenten como logo y el halo no, una apertura y un
    cierre de 5 pixeles para limar el borde, marching squares para sacar
    los contornos, y remuestreo antes de suavizar -sin eso cada peldaño del
    mapa de bits se toma por una esquina y el trazo vuelve a salir con
    muescas-.

    Los dos extremos cortados en plano son esquinas de verdad y se
    conservan: el suavizado no cruza una esquina.
  -->
  <rect width="100" height="100" rx="22" fill="#0A0A0A"/>
  <rect x="1.5" y="1.5" width="97" height="97" rx="20.5" fill="none" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="3"/>
