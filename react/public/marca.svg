<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="sharee">
  <!--
    La marca de sharee, sacada del fichero original de CorelDRAW.

    De las cuatro capas que trae ese fichero -la sombra, el biselado 3D
    hecho de sesenta poligonos, una copia cian y un mapa de bits enlazado
    que ni siquiera venia- aqui solo esta la que importa: `.fil3`, la cara
    plana del logo, en sus tres trazos.

    Eso es lo que hace falta para una interfaz. El bisel y el brillo son
    del render: a 16 pixeles se convierten en una mancha gris, y ademas
    impiden recolorear. Con la cara plana y `currentColor`, la marca se
    pinta del color que tenga el texto donde este.

    Antes esto se trazaba del PNG. Salia bien -5.9 kB- pero era una
    aproximacion; esto son las curvas del autor, y ocupa 1.1 kB.
  -->
