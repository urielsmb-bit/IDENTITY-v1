<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="sharee">
  <!--
    La marca de sharee: dos eslabones enganchados.

    Dice las dos cosas que hace el producto sin escribir ninguna: un
    eslabon es un ENLACE, y dos enganchados es COMPARTIR. De lejos se lee
    como un simbolo de infinito, que es lo que la salva a tamaño de
    pestaña: a 16 pixeles no se distinguen dos formas, se distingue una
    silueta.

    El aro de la derecha esta PARTIDO en los dos puntos donde el otro lo
    cruza, y esas roturas son arcos de verdad -no un trazo del color del
    fondo pintado encima-. Por eso el cruce se ve igual sobre negro, sobre
    blanco o sobre una foto.

    Es un dibujo hecho a partir de la referencia. Si aparece el fichero
    original del logo, se sustituye aqui y en `icono.svg`.
  -->
  <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round">
    <path d="M30.4 36.37A11 11 0 0 1 30.4 27.63M34.25 22.95A11 11 0 1 1 34.25 41.05" />
    <circle cx="23.5" cy="32" r="11" />
  </g>
</svg>
