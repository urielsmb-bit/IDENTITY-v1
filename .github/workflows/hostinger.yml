# Compila sharee y lo sube a Hostinger.
#
# ────────────────────────────────────────────────────────────────────────
# QUE HACE FALTA ANTES DE QUE ESTO FUNCIONE
# ────────────────────────────────────────────────────────────────────────
#
# En GitHub → Settings → Secrets and variables → Actions → New repository
# secret. Los pegas tu ahi; no viajan por ningun otro sitio y no aparecen en
# los registros —GitHub los tacha—:
#
#   SSH_HOST     la IP del servidor (hPanel → Avanzado → Acceso SSH)
#   SSH_PORT     su puerto. Hostinger no usa el 22
#   SSH_USER     el usuario, algo como u251278312
#   SSH_KEY      la clave PRIVADA de un par creado solo para desplegar,
#                entera, con sus lineas BEGIN y END. La publica se anade en
#                esa misma pantalla de hPanel, en «Agregar clave SSH»
#   SSH_HOSTKEY  la huella del servidor, para fijarla. Se saca con:
#                  ssh-keyscan -p <puerto> -t ed25519 <ip>
#                No es secreta: es publica por definicion. Va en un secreto
#                solo para no repetir la IP en el fichero
#
#   VITE_SUPABASE_URL   los mismos valores que ya tienes en
#   VITE_SUPABASE_KEY   react/.env.local. La clave es la ANONIMA, la que
#                       ya viaja dentro del JavaScript publico
#   VITE_VIMEO          cualquier valor. Enciende la subida de videos a
#                       Vimeo; sin ella van al cubo, con un tope mucho
#                       mas bajo. El token de verdad vive en la funcion
#                       de borde `vimeo-subida`, en Supabase, no aqui
#   VITE_FN_VISTAS      la funcion que cuenta las visitas
#
# Y uno opcional, `SSH_DIR`, si la web no esta en
# `domains/<dominio>/public_html`. OJO: la ruta de SSH NO es la del FTP —
# el FTP te deja enjaulado y `public_html` te queda al lado, SSH entra en el
# inicio de verdad. Para saber cual es la tuya:
#
#   ssh -p <puerto> <usuario>@<ip> 'find ~ -maxdepth 4 -name public_html'
#
# ────────────────────────────────────────────────────────────────────────
# CUANDO SE LANZA
# ────────────────────────────────────────────────────────────────────────
#
# Al empujar a `main` algo que toque `react/`. Un cambio en un documento de
# la raiz no reconstruye ni sube nada, que es lo suyo: desplegar por un
# README es gastar minutos y arriesgar el sitio en vivo a cambio de nada.
#
# Tambien a mano, desde la pestana Actions → «Subir a Hostinger» → Run
# workflow, por si quieres forzar una subida sin tocar codigo.

name: Subir a Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'react/**'
      - '.github/workflows/hostinger.yml'
  workflow_dispatch:

# Dos despliegues a la vez sobre el mismo `public_html` se pisan, y lo que
# queda arriba es una mezcla de los dos. Se encola: el nuevo espera, no
# cancela al que ya esta subiendo ficheros.
concurrency:
  group: hostinger
  cancel-in-progress: false

jobs:
  subir:
    runs-on: ubuntu-latest
    # Solo lectura del repositorio. Este trabajo no escribe nada en GitHub.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react/package-lock.json

      - name: Instalar
        working-directory: react
        run: npm ci

      - name: Comprobar
        working-directory: react
        run: |
          npx tsc -b
          npx vitest run
          npx eslint src
        # Si algo de esto falla, NO se sube. Es la razon de que esten aqui:
        # un despliegue que no comprueba nada es un despliegue que un dia
        # publica el sitio roto y nadie se entera hasta que alguien entra.

      - name: La configuracion de la compilacion
        working-directory: react
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VIMEO: ${{ secrets.VITE_VIMEO }}
          FN_VISTAS: ${{ secrets.VITE_FN_VISTAS }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Faltan VITE_SUPABASE_URL o VITE_SUPABASE_KEY en los secretos."
            echo "Sin eso la aplicacion compila, pero sale sin backend."
            exit 1
          fi
          # Se escribe el fichero que `vite` y `build:hostinger` esperan.
          # Vive solo dentro de esta maquina, que se destruye al terminar.
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_KEY=%s\n' "$URL" "$KEY" > .env.local

          # Las dos que NO son obligatorias, y por eso son peligrosas: si
          # faltan, la aplicacion compila sin quejarse y lo que desaparece
          # es una funcion entera. VITE_VIMEO apaga la subida de videos a
          # Vimeo y los manda al cubo con un tope mucho mas bajo;
          # VITE_FN_VISTAS deja de contar las visitas. Nada falla, nada
          # avisa, y el dia que alguien lo note nadie lo relaciona con un
          # despliegue de hace tres semanas.
          #
          # Por eso se avisa AQUI, en el registro: es el unico sitio donde
          # alguien va a mirar cuando se pregunte que paso.
          if [ -n "$VIMEO" ]; then
            printf 'VITE_VIMEO=%s\n' "$VIMEO" >> .env.local
          else
            echo "Aviso: sin VITE_VIMEO. Los videos iran al cubo, no a Vimeo."
          fi
          if [ -n "$FN_VISTAS" ]; then
            printf 'VITE_FN_VISTAS=%s\n' "$FN_VISTAS" >> .env.local
          else
            echo "Aviso: sin VITE_FN_VISTAS. No se contaran las visitas."
          fi

      - name: Compilar
        working-directory: react
        run: |
          npm run build
          node scripts/hostinger.mjs

      # ────────────────────────────────────────────────────────────────
      # POR SSH, NO POR FTP
      # ────────────────────────────────────────────────────────────────
      #
      # La primera version subia con `lftp` sobre FTP con TLS, y se estrello
      # contra el certificado:
      #
      #   mirror: Fatal error: Certificate verification:
      #           certificate common name doesn't match requested host name
      #
      # El FTP de Hostinger presenta un certificado de verdad —Sectigo, para
      # `hostinger.com` y una lista larga de dominios suyos— pero no para
      # `ftp.sharee.fun`: el alojamiento es compartido y el certificado es del
      # servidor, no del dominio. No existe ningun nombre que resuelva Y
      # encaje, asi que por FTP solo quedaba relajar la comprobacion.
      #
      # SSH no tiene ese problema y es mejor en todo lo demas:
      #
      #   · no viaja ninguna contrasena. Se autentica con una clave, y la
      #     publica la tiene Hostinger;
      #   · el servidor se identifica con su HUELLA, fijada aqui abajo. Si
      #     cambiara —o alguien se pusiera en medio— la conexion se corta en
      #     vez de continuar;
      #   · `rsync` manda solo lo que cambio, no la compilacion entera.
      - name: Subir
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOSTKEY: ${{ secrets.SSH_HOSTKEY }}
          # La ruta de SSH no es la del FTP, y esto se comprobo conectando.
          # El FTP te deja enjaulado y `public_html` te queda al lado; SSH
          # entra en `/home/u251278312` de verdad, donde NO hay ningun
          # `public_html` — la web vive en `domains/<dominio>/public_html`.
          #
          # Con la ruta del FTP, `rsync` habria CREADO esa carpeta en el
          # inicio y habria subido ahi los 86 ficheros. Todo en verde, cero
          # errores, y la web sin cambiar. Ese es el peor final posible: el
          # que no avisa.
          DESTINO: ${{ secrets.SSH_DIR || 'domains/sharee.fun/public_html' }}
        run: |
          set -euo pipefail
          for v in SSH_HOST SSH_PORT SSH_USER SSH_KEY SSH_HOSTKEY; do
            if [ -z "${!v}" ]; then
              echo "Falta el secreto $v."
              exit 1
            fi
          done

          # La clave y la huella, en ficheros con permisos cerrados. Viven en
          # la maquina de GitHub, que se destruye al terminar el trabajo.
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/despliegue
          chmod 600 ~/.ssh/despliegue
          printf '%s\n' "$SSH_HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # `StrictHostKeyChecking=yes` es el punto de todo esto: sin la
          # huella correcta en `known_hosts`, no conecta. Lo contrario
          # —aceptar la que venga— es exactamente el agujero que se queria
          # evitar al dejar el FTP.
          ORDEN="ssh -i ~/.ssh/despliegue -p $SSH_PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts"

          # EL DESTINO TIENE QUE EXISTIR YA.
          #
          # `rsync` crea con gusto la carpeta que le pidas, y esa amabilidad
          # es la trampa: con la ruta equivocada sube los 86 ficheros a un
          # sitio nuevo, termina en verde, y la web no cambia. Un despliegue
          # que miente es peor que uno que falla.
          #
          # Se comprueba antes. Si no esta, se para y se dice donde mirar.
          if ! $ORDEN "$SSH_USER@$SSH_HOST" "test -d '$DESTINO'"; then
            echo "El destino '$DESTINO' no existe en el servidor."
            echo "Ojo: la ruta de SSH NO es la del FTP. Conectate y mira:"
            echo "  ssh -p $SSH_PORT $SSH_USER@$SSH_HOST 'find ~ -maxdepth 4 -name public_html'"
            echo "Cuando sepas cual es, ponla en el secreto SSH_DIR."
            exit 1
          fi

          # Primero TODO, sin borrar nada. Si en public_html hay algo que
          # pusiste tu a mano, sigue ahi despues de esto.
          rsync -rlvz --checksum -e "$ORDEN" \
            react/salida-hostinger/ "$SSH_USER@$SSH_HOST:$DESTINO/"

          # Y despues, solo dentro de assets/, si que se borra lo que sobra.
          # Esa carpeta la genera entera la compilacion y sus nombres llevan
          # un resumen del contenido, asi que sin esto se irian acumulando
          # los de todas las compilaciones anteriores para siempre. Ahi no
          # hay nada tuyo que perder.
          rsync -rlvz --checksum --delete -e "$ORDEN" \
            react/salida-hostinger/assets/ "$SSH_USER@$SSH_HOST:$DESTINO/assets/"

          echo "Subido a $DESTINO."
